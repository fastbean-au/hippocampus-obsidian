name: Contract bump

# Re-vendor contract/hippocampus.swagger.json when the service cuts a release, and open a PR.
#
# This exists because a satellite repository without one goes stale silently. hippocampus-gen sits
# eleven releases behind its pinned service version for exactly this reason, and the plugin has more
# to lose: contract/SERVICE_VERSION is also the minimum service version this plugin declares, so a
# stale pin is a stale promise as well as a stale document.
#
# Fired by a repository_dispatch from the service's release workflow (type `hippocampus-release`,
# client_payload.tag), and runnable by hand for a catch-up or a re-run.
on:
  repository_dispatch:
    types: [hippocampus-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Service tag to vendor the contract from (e.g. v0.48.0)"
        required: true

permissions:
  contents: write # push the branch the PR is opened from
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The tag is the only thing the dispatch carries, and everything below keys off it. Validate
      # its shape before it reaches a URL: an unvalidated payload field is attacker-influenced input
      # in a job that opens a pull request.
      - name: Resolve the service tag
        run: |
          set -euo pipefail

          tag="${{ github.event.client_payload.tag || inputs.tag }}"

          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z service tag"
            exit 1
          fi

          echo "SERVICE_TAG=$tag" >> "$GITHUB_ENV"

      # Fetch the generated OpenAPI document from the released tag rather than from main, so what is
      # vendored is what that release actually serves.
      - name: Vendor the contract from that release
        run: |
          set -euo pipefail

          url="https://raw.githubusercontent.com/fastbean-au/hippocampus/${SERVICE_TAG}/contract/hippocampus.swagger.json"

          previous="$(cat contract/SERVICE_VERSION)"

          curl -fsSL "$url" -o contract/hippocampus.swagger.json
          printf '%s\n' "$SERVICE_TAG" > contract/SERVICE_VERSION

          # README.md names the floor in prose as well, and the conformance suite holds the two
          # together - so bumping the pin alone would open a pull request that fails its own check.
          sed -i "s|Hippocampus ${previous} or newer|Hippocampus ${SERVICE_TAG} or newer|" README.md

          # A document that does not parse would fail the conformance suite below anyway, but it
          # fails more legibly here, next to the URL it came from.
          jq -e '.paths | length > 0' contract/hippocampus.swagger.json >/dev/null

      - name: Check whether anything moved
        id: diff
        run: |
          if git diff --quiet contract/ README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "contract is already at $SERVICE_TAG - nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: "24"
          cache: npm

      # Run the conformance suite against the NEW contract before opening anything. The PR is worth
      # opening either way - a red one is the notification that the gateway moved under the plugin,
      # which is the whole point of this workflow - so the failure is recorded and not fatal here.
      - name: Run the conformance suite against the new contract
        if: steps.diff.outputs.changed == 'true'
        id: conformance
        continue-on-error: true
        run: |
          npm ci
          npm test

      - name: Open the bump pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: contract/${{ env.SERVICE_TAG }}
          base: main
          commit-message: "Vendor the contract from hippocampus ${{ env.SERVICE_TAG }}"
          title: "Vendor the contract from hippocampus ${{ env.SERVICE_TAG }}"
          body: |
            Re-vendored `contract/hippocampus.swagger.json` from
            [`${{ env.SERVICE_TAG }}`](https://github.com/fastbean-au/hippocampus/releases/tag/${{ env.SERVICE_TAG }})
            and raised `contract/SERVICE_VERSION` to match.

            Conformance suite against the new contract: **${{ steps.conformance.outcome }}**.

            A failure here is not noise — it means a route or a field this plugin hand-writes has
            moved, and the plugin needs changing before this merges. A pass means the plugin is
            compatible with `${{ env.SERVICE_TAG }}`, and merging raises the minimum service version
            it declares.
          labels: contract

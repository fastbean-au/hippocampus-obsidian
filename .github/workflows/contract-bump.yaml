name: Contract bump

# Raise the hippocampus-client dependency when the service cuts a release, and open a PR.
#
# The plugin's wire is hippocampus-client, the TypeScript client the service generates from its own
# contract and attaches to every release as a tarball. Until 2026-11 this workflow re-vendored the
# OpenAPI document instead, for a conformance suite that policed a hand-written client; with the
# client generated, the dependency IS the contract, and the plugin's own tests run against it.
#
# This exists because a satellite repository without one goes stale silently. hippocampus-gen sits
# eleven releases behind its pinned service version for exactly this reason, and the plugin has more
# to lose: contract/SERVICE_VERSION is also the minimum service version this plugin declares, so a
# stale pin is a stale promise as well as a stale dependency.
#
# Fired by a repository_dispatch from the service's release workflow (type `hippocampus-release`,
# client_payload.tag), and runnable by hand for a catch-up or a re-run.
on:
  repository_dispatch:
    types: [hippocampus-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Service tag to take hippocampus-client from (e.g. v0.54.0)"
        required: true

permissions:
  contents: write # push the branch the PR is opened from
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The tag is the only thing the dispatch carries, and everything below keys off it. Validate
      # its shape before it reaches a URL: an unvalidated payload field is attacker-influenced input
      # in a job that opens a pull request.
      - name: Resolve the service tag
        run: |
          set -euo pipefail

          tag="${{ github.event.client_payload.tag || inputs.tag }}"

          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z service tag"
            exit 1
          fi

          echo "SERVICE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # The release's own tarball rather than npm, because the package is not uploaded there yet
      # and the tarball is what the service's release job attaches whether or not it is. A release
      # without one is not one this plugin can move to, and saying so here is more legible than an
      # npm error in the next step.
      - name: Raise the client to that release
        run: |
          set -euo pipefail

          url="https://github.com/fastbean-au/hippocampus/releases/download/${SERVICE_TAG}/hippocampus-client-${SERVICE_TAG#v}.tgz"

          if ! curl -fsIL -o /dev/null "$url"; then
            echo "::error::${SERVICE_TAG} has no hippocampus-client tarball attached - cannot move to it"
            exit 1
          fi

          previous="$(cat contract/SERVICE_VERSION)"

          npm install --save --ignore-scripts "hippocampus-client@${url}"
          printf '%s\n' "$SERVICE_TAG" > contract/SERVICE_VERSION

          # README.md names the floor in prose as well.
          sed -i "s|Hippocampus ${previous} or newer|Hippocampus ${SERVICE_TAG} or newer|" README.md

      - name: Check whether anything moved
        id: diff
        run: |
          if git diff --quiet contract/ README.md package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already on $SERVICE_TAG - nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Build and test against the NEW client before opening anything. The PR is worth opening either
      # way - a red one is the notification that the client moved under the plugin, which is the
      # whole point of this workflow - so the failure is recorded and not fatal here.
      - name: Build and test against the new client
        if: steps.diff.outputs.changed == 'true'
        id: verify
        continue-on-error: true
        run: |
          npm ci
          npm run build
          npm test

      - name: Open the bump pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # GITHUB_TOKEN cannot open a pull request unless the repository has
          # Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull
          # requests" ticked, and even with it ticked a pull request it opens fires no
          # `pull_request` event - so CI never runs on the bump, and the only verification is
          # whatever this workflow reports inline. A PAT avoids both: it is the same token the
          # service's release workflow dispatches with, plus Pull requests: write. Falls back
          # to GITHUB_TOKEN when the secret is absent.
          token: ${{ secrets.BUMP_PR_TOKEN || github.token }}
          branch: contract/${{ env.SERVICE_TAG }}
          base: main
          commit-message: "Build against hippocampus-client ${{ env.SERVICE_TAG }}"
          title: "Build against hippocampus-client ${{ env.SERVICE_TAG }}"
          body: |
            Raised `hippocampus-client` to the tarball attached to
            [`${{ env.SERVICE_TAG }}`](https://github.com/fastbean-au/hippocampus/releases/tag/${{ env.SERVICE_TAG }})
            and `contract/SERVICE_VERSION` to match.

            Build and tests against the new client: **${{ steps.verify.outcome }}**.

            A failure here is not noise — it means something the plugin uses in the client has moved,
            and the plugin needs changing before this merges. A pass means the plugin is
            compatible with `${{ env.SERVICE_TAG }}`, and merging raises the minimum service version
            it declares.
          labels: contract
